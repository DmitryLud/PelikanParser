<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8"><title>Вход</title></head>
  <body>
    <form id="login-form" class="space-y-2.5">
      <label for="mail">Адрес электронной почты</label>
      <input id="mail" data-slot="input" name="username" type="email" placeholder="Адрес электронной почты" required>
      <label for="password">Пароль</label>
      <input id="password" data-slot="input" name="password" type="password" placeholder="Пароль" required>
      <button data-slot="button" type="submit">Вход</button>
    </form>
    <script>
      document.getElementById('login-form').addEventListener('submit', (event) => {
        event.preventDefault();
        window.location.href = '/catalog.html';
      });
    </script>
  </body>
</html>
