[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pelikan-eurocode-parser"
version = "0.1.0"
description = "Local configurable Eurocode price parser with Excel output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "playwright>=1.55,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
]

[project.scripts]
pelikan-parser = "pelikan_parser.cli:main"

[tool.setuptools.packages.find]
include = ["pelikan_parser*"]
